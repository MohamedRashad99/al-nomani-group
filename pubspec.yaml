name: al_nomani_group
description: نظام تخطيط موارد المؤسسات لمجموعة النعماني — Offline-First ERP.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  al_nomani_shared:
    path: packages/shared
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.2.0
  dio: ^5.9.0
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3: ^2.9.0
  uuid: ^4.5.1
  intl: ^0.20.2
  go_router: ^16.2.4
  bcrypt: ^1.2.0
  connectivity_plus: ^6.1.5
  file_picker: ^10.3.3
  excel: ^4.0.6
  csv: ^6.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_secure_storage: ^9.2.4
  path: ^1.9.1
  collection: ^1.19.1
  meta: ^1.16.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  dart_jsonwebtoken: ^3.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.3
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/images/
  fonts:
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic-Regular.ttf
