services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: al_nomani
    ports:
      - "5432:5432"
    volumes:
      - nomani_pg:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/al_nomani
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      GOOGLE_LIVE_SPREADSHEET_ID: 1TvyxxkYH4iLyYfwHnVMMTuyPCekUNvFerfV-HgSp22I
      GOOGLE_FULL_SPREADSHEET_ID: ${GOOGLE_FULL_SPREADSHEET_ID:-1TvyxxkYH4iLyYfwHnVMMTuyPCekUNvFerfV-HgSp22I}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
      SYNC_INTERVAL_DAYS: 5
      ALLOW_SEED: "true"
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe!Admin1}
      DATABASE_SSL: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      - postgres

volumes:
  nomani_pg:
