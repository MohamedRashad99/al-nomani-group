<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/al-nomani-group/docs/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نظام مجموعة النعماني — إدارة المنتجات الزراعية دون اتصال">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="النعماني">
  <meta name="theme-color" content="#1B5E20">
  <link rel="apple-touch-icon" href="icons/al-nomani-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>مجموعة النعماني</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #F4F1EA; }
  </style>
</head>
<body>
  <script>
    (function () {
      function loadBootstrap(version) {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(version || Date.now());
        script.async = true;
        document.body.appendChild(script);
      }
      fetch('version.json?t=' + Date.now())
        .then(function (response) { return response.json(); })
        .then(function (data) { loadBootstrap(data.build_label); })
        .catch(function () { loadBootstrap(); });
    })();
  </script>
</body>
</html>
