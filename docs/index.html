<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/al-nomani-group/docs/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نظام مجموعة النعماني — إدارة المنتجات الزراعية دون اتصال">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="النعماني">
  <meta name="theme-color" content="#1B5E20">
  <link rel="apple-touch-icon" href="icons/al-nomani-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>مجموعة النعماني</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #1B5E20; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #1B5E20;
      z-index: 9999; color: #F4F1EA; font-family: Tahoma, sans-serif;
      overflow: hidden;
    }
    #boot .seed {
      position: absolute; width: 7px; height: 12px; border-radius: 50%;
      opacity: .45; animation: seed-rise 2.8s linear infinite;
    }
    #boot img {
      width: 96px; height: 96px; border-radius: 28px; background: #fff;
      padding: 10px; box-shadow: 0 0 28px rgba(212,180,131,.35);
      animation: nomani-pulse 1.1s ease-in-out infinite alternate;
      position: relative; z-index: 1;
    }
    #boot p { margin: 16px 0 0; font-weight: 700; position: relative; z-index: 1; }
    @keyframes nomani-pulse {
      from { transform: scale(.94); opacity: .85; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes seed-rise {
      from { transform: translateY(110vh) rotate(-20deg); opacity: 0; }
      15% { opacity: .55; }
      to { transform: translateY(-12vh) rotate(18deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <span class="seed" style="left:8%;background:#D4B483;animation-delay:0s"></span>
    <span class="seed" style="left:18%;background:#A5D6A7;animation-delay:.3s"></span>
    <span class="seed" style="left:29%;background:#FFCC80;animation-delay:.7s"></span>
    <span class="seed" style="left:41%;background:#D4B483;animation-delay:.15s"></span>
    <span class="seed" style="left:54%;background:#A5D6A7;animation-delay:.9s"></span>
    <span class="seed" style="left:66%;background:#FFCC80;animation-delay:.45s"></span>
    <span class="seed" style="left:77%;background:#D4B483;animation-delay:.2s"></span>
    <span class="seed" style="left:88%;background:#A5D6A7;animation-delay:.6s"></span>
    <img src="icons/al-nomani-192.png" alt="مجموعة النعماني">
    <p>مجموعة النعماني</p>
  </div>
  <script>
    (function () {
      function dropBoot() {
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
      }
      window.addEventListener('flutter-first-frame', dropBoot);
      function loadBootstrap(version) {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(version || Date.now());
        script.async = true;
        document.body.appendChild(script);
      }
      fetch('version.json?t=' + Date.now())
        .then(function (response) { return response.json(); })
        .then(function (data) { loadBootstrap(data.build_label); })
        .catch(function () { loadBootstrap(); });
    })();
  </script>
</body>
</html>
