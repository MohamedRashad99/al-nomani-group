name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - name: Shared package
        working-directory: packages/shared
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Flutter packages
        run: flutter pub get
      - name: Web SQLite assets
        run: bash tool/prepare_web_db.sh
      - name: Generate Drift
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Format
        run: dart format lib packages/shared/lib server/lib test
      - name: Analyze Flutter
        run: flutter analyze
      - name: Test Flutter
        run: flutter test
      - name: Server
        working-directory: server
        run: |
          dart pub get
          dart analyze
      - name: Build Flutter Web
        run: flutter build web --release --pwa-strategy=offline-first --source-maps --dart-define=ENVIRONMENT=ci
