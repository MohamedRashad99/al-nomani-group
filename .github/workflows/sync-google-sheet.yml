name: Sync Google Sheet

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-sheet]
  push:
    branches: [version_1]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version_1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install writer
        run: npm install googleapis@148
      - name: Write live spreadsheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node tool/sync_sheet_from_firestore.mjs
